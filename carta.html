<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Analyzer su carta</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--ink:#1d2226;--mark:#e2561b;--paper:#f3f4f5;--muted:#5c656c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,-apple-system,sans-serif}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--body);overflow:hidden}
#ar{position:fixed;inset:0}
/* schermata iniziale */
#intro{position:fixed;inset:0;z-index:20;background:var(--paper);color:var(--ink);display:grid;place-content:center;gap:18px;
  padding:24px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left));text-align:left}
#intro .brand{font:600 14px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
#intro .brand i{width:26px;height:5px;background:repeating-linear-gradient(90deg,var(--mark) 0 9px,transparent 9px 14px)}
#intro h1{font:700 clamp(40px,11vw,64px)/.95 var(--display);text-transform:uppercase;margin:0}
#intro h1 em{font-style:normal;color:var(--mark)}
#intro p{margin:0;max-width:34ch;color:var(--muted);line-height:1.5}
#start{justify-self:start;background:var(--mark);color:#fff;border:0;border-radius:999px;font:600 17px var(--body);padding:14px 24px;cursor:pointer}
#start:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#err{color:#b3261e;font-size:14px;max-width:34ch}
/* barra in AR */
#hud{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:linear-gradient(transparent,rgba(0,0,0,.75));display:flex;align-items:flex-end;justify-content:space-between;gap:12px;pointer-events:none}
#info{font-size:13px;line-height:1.35;min-width:0}
#info b{font:700 22px/1 var(--display);text-transform:uppercase;display:block;margin-bottom:3px}
#info span{font-variant-numeric:tabular-nums;opacity:.85}
#focus{font:700 clamp(26px,7.5vw,40px)/1.05 var(--display);text-transform:uppercase;margin-bottom:6px;display:flex;gap:10px;align-items:center}
#focus i{width:14px;height:14px;border-radius:3px;flex:none}
#focus small{display:block;font:500 clamp(15px,4.2vw,19px)/1.3 var(--body);text-transform:none;opacity:.9}
#tap{font-size:12px;opacity:.7;margin-top:4px}
.btn{pointer-events:auto;background:rgba(255,255,255,.95);color:var(--ink);border:0;border-radius:999px;font:600 14px var(--body);padding:10px 16px;white-space:nowrap;cursor:pointer}
#hint{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.6);
  padding:8px 14px;border-radius:999px;font-size:14px;white-space:nowrap}
[hidden]{display:none!important}
</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three":"https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"}}</script>
</head>
<body>
<div id="intro">
  <div class="brand"><i></i>EVOLVE · Road Analyzer</div>
  <h1>La strada <em>prende vita</em></h1>
  <p>Inquadra la stampa del fotogramma: dai danni rilevati da Road Analyzer si alzano i riquadri con classe, confidenza e gravità.</p>
  <button id="start">Apri la fotocamera</button>
  <p id="err" hidden></p>
</div>
<div id="ar"></div>
<div id="hint" hidden>Inquadra tutta la stampa</div>
<div id="hud" hidden>
  <div id="info"><div id="focus" hidden></div><div id="meta"></div><div id="tap" hidden>Tocca lo schermo per il danno successivo</div></div>
  <button class="btn" id="replay" hidden>Rivedi</button>
</div>
<script type="module">
import * as THREE from "three";
import { MindARThree } from "mindar-image-three";

const FRAMES = [{"title": "Strada residenziale", "file": "2026_0508_133936_000332F_frame0019.jpg", "w": 1920, "h": 994, "score": 74, "date": "2026-05-08", "lat": 44.931055, "lon": 12.330876, "dets": [{"b": [473, 961, 724, 993], "c": "Transverse Cracking", "s": 0.94, "v": "M"}, {"b": [911, 746, 943, 826], "c": "Longitudinal Cracking", "s": 0.89, "v": "M"}, {"b": [1032, 801, 1102, 991], "c": "Longitudinal Cracking", "s": 0.87, "v": "M"}, {"b": [1139, 552, 1183, 606], "c": "Divieto di transito per autocarri", "s": 1.0, "v": "", "sign": true}]}, {"title": "Incrocio", "file": "2026_0508_133736_000330F_frame0017.jpg", "w": 1920, "h": 994, "score": 77, "date": "2026-05-08", "lat": 44.931812, "lon": 12.331189, "dets": [{"b": [1330, 714, 1351, 863], "c": "Longitudinal Cracking", "s": 0.72, "v": "L"}, {"b": [910, 719, 1075, 788], "c": "Longitudinal Cracking", "s": 0.7, "v": "L"}, {"b": [496, 812, 716, 846], "c": "Transverse Cracking", "s": 0.68, "v": "L"}, {"b": [1420, 797, 1676, 820], "c": "Transverse Cracking", "s": 0.64, "v": "L"}, {"b": [633, 845, 980, 916], "c": "Alligator Cracking", "s": 0.44, "v": "L"}, {"b": [272, 802, 340, 819], "c": "Manhole", "s": 0.9, "v": ""}, {"b": [1716, 810, 1803, 830], "c": "Manhole", "s": 0.87, "v": ""}, {"b": [452, 739, 485, 749], "c": "Manhole", "s": 0.79, "v": ""}, {"b": [1010, 907, 1035, 919], "c": "Pothole", "s": 0.4, "v": "L"}, {"b": [1623, 422, 1689, 493], "c": "Attraversamento pedonale/ciclabile (V.42)", "s": 1.0, "v": "", "sign": true}, {"b": [715, 524, 753, 565], "c": "Attraversamento pedonale/ciclabile (V.42)", "s": 1.0, "v": "", "sign": true}]}];
const COLORS = {"Longitudinal Cracking":"#22b14c","Transverse Cracking":"#1e5aff","Alligator Cracking":"#e8202a",
  "Pothole":"#d633d6","Manhole":"#f59614","Patching":"#00aac8"};
const SIGN = "#f5d700";
const IT = {"Longitudinal Cracking":"Crepa longitudinale","Transverse Cracking":"Crepa trasversale",
  "Alligator Cracking":"Pelle di coccodrillo","Pothole":"Buca","Manhole":"Tombino","Patching":"Rappezzo"};
const shortName = d => d.sign ? d.c.split(" (")[0].replace("Attraversamento pedonale/ciclabile","Attravers. pedonale") : (IT[d.c] || d.c);
const subLine = d => d.sign ? `cartello · ${Math.round(d.s * 100)}%` : `${d.s.toFixed(2)}${d.v ? " · gravità " + d.v : ""}`;
const $ = id => document.getElementById(id);

function labelTexture(text, sub, color){
  const c = document.createElement("canvas"), x = c.getContext("2d");
  const big = "bold 64px 'IBM Plex Sans', Arial, sans-serif", small = "50px 'IBM Plex Sans', Arial, sans-serif";
  x.font = big; let w = x.measureText(text).width;
  if (sub){ x.font = small; w = Math.max(w, x.measureText(sub).width); }
  c.width = Math.ceil(w + 80); c.height = sub ? 176 : 100;
  x.fillStyle = color; x.fillRect(0, 0, c.width, c.height);
  const r = parseInt(color.slice(1,3),16), g = parseInt(color.slice(3,5),16), b = parseInt(color.slice(5,7),16);
  x.fillStyle = (r + g + b > 520) ? "#16191b" : "#ffffff";
  x.textBaseline = "middle"; x.font = big; x.fillText(text, 40, sub ? 54 : 52);
  if (sub){ x.font = small; x.fillText(sub, 40, 130); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  return { tex: t, aspect: c.width / c.height };
}

// costruisce i riquadri di un fotogramma nello spazio del bersaglio (larghezza stampa = 1)
function buildFrame(f){
  const root = new THREE.Group(), groups = [];
  const X = px => px / f.w - 0.5, Y = py => (f.h / 2 - py) / f.w;
  const dets = [...f.dets].sort((a, b) => (a.b[0] + a.b[2]) - (b.b[0] + b.b[2]));
  dets.forEach((d, i) => {
    const color = d.sign ? SIGN : (COLORS[d.c] || "#cccccc");
    const mat = new THREE.MeshBasicMaterial({ color });
    const [x0, y0, x1, y1] = d.b;
    const g = new THREE.Group();
    g.position.set(X((x0 + x1) / 2), Y((y0 + y1) / 2), 0);
    const bw = Math.max((x1 - x0) / f.w, 0.006), bh = Math.max((y1 - y0) / f.w, 0.006), t = 0.0035, z = 0.002;
    // cornice sulla carta
    [[bw + t, t, 0, bh / 2], [bw + t, t, 0, -bh / 2], [t, bh, -bw / 2, 0], [t, bh, bw / 2, 0]].forEach(([w, h, px, py]) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, t), mat); m.position.set(px, py, z); g.add(m);
    });
    const fill = new THREE.Mesh(new THREE.PlaneGeometry(bw, bh),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.22, depthWrite: false }));
    fill.position.z = 0.001; g.add(fill);
    // stelo
    const hgt = 0.05;
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.0022, 0.0022, hgt, 8), mat);
    stem.rotation.x = Math.PI / 2; stem.position.z = hgt / 2; g.add(stem);
    // etichetta grande (sprite: sempre dritta verso lo schermo), mostrata solo per il danno in evidenza
    const L = labelTexture(shortName(d), subLine(d), color);
    const lh = 0.12, lw = lh * L.aspect;
    const lab = new THREE.Sprite(new THREE.SpriteMaterial({ map: L.tex, depthTest: false }));
    lab.center.set(0.5, 0); lab.scale.set(lw, lh, 1); lab.renderOrder = 10;
    lab.position.z = hgt; lab.visible = false; g.add(lab);
    g.scale.setScalar(0.001);
    root.add(g); groups.push({ g, lab, d, color, delay: 0.5 + i * 0.18 });
  });
  return { root, groups };
}

let anim = null, focus = { fr: null, i: -1, next: 0, hold: 0 };
function setFocus(fr, i){
  fr.groups.forEach((o, k) => { o.lab.visible = (k === i); });
  focus.fr = fr; focus.i = i;
  const o = fr.groups[i];
  $("focus").hidden = false; $("tap").hidden = false;
  $("focus").innerHTML = `<i style="background:${o.color}"></i><div>${shortName(o.d)}<small>${subLine(o.d)} · ${i + 1} di ${fr.groups.length}</small></div>`;
}
const ease = t => { t = Math.min(Math.max(t, 0), 1); const s = 1.70158; return 1 + (s + 1) * Math.pow(t - 1, 3) + s * Math.pow(t - 1, 2); };
function play(fr){
  anim = { fr, t0: performance.now() / 1000 };
  fr.groups.forEach(o => { o.g.scale.setScalar(0.001); o.lab.visible = false; });
  const last = fr.groups.length ? fr.groups[fr.groups.length - 1].delay + 0.7 : 0;
  focus = { fr, i: -1, next: performance.now() / 1000 + last, hold: 0 };
}

async function start(){
  $("start").disabled = true; $("start").textContent = "Avvio…";
  const mind = new MindARThree({ container: $("ar"), imageTargetSrc: "targets.mind", maxTrack: 1,
    uiLoading: "yes", uiScanning: "no", uiError: "yes", filterMinCF: 0.0001, filterBeta: 0.004 });
  const { renderer, scene, camera } = mind;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  const built = FRAMES.map((f, i) => {
    const fr = buildFrame(f), anchor = mind.addAnchor(i);
    anchor.group.add(fr.root);
    anchor.onTargetFound = () => {
      $("hint").hidden = true; $("replay").hidden = false; current = fr;
      $("meta").innerHTML = `<span>${f.title} · road score ${f.score} · ${f.date} · ${f.lat.toFixed(5)}, ${f.lon.toFixed(5)} · v4</span>`;
      if (!fr.played){ fr.played = true; play(fr); }
      else if (focus.fr !== fr){ focus = { fr, i: -1, next: 0, hold: 0 }; }
    };
    anchor.onTargetLost = () => { $("hint").hidden = false; };
    return fr;
  });
  let current = null;
  $("replay").onclick = (e) => { e.stopPropagation(); current && play(current); };
  // tocco sullo schermo: danno successivo, e pausa della rotazione automatica
  $("ar").addEventListener("click", () => {
    if (!focus.fr || !focus.fr.groups.length) return;
    const now = performance.now() / 1000;
    setFocus(focus.fr, (focus.i + 1) % focus.fr.groups.length); focus.next = now + 3; focus.hold = now + 8;
  });
  try {
    await mind.start();
  } catch (e) {
    $("start").disabled = false; $("start").textContent = "Riprova";
    $("err").hidden = false;
    $("err").textContent = "Non riesco ad aprire la fotocamera. Consenti l'accesso alla fotocamera e apri questa pagina in Chrome o Safari, non dentro WhatsApp o altre app.";
    return;
  }
  $("intro").hidden = true; $("hud").hidden = false; $("hint").hidden = false;
  $("meta").innerHTML = `<b>Road Analyzer</b><span>Inquadra una delle stampe A3 · v4</span>`;
  renderer.setAnimationLoop(() => {
    if (anim){
      const t = performance.now() / 1000 - anim.t0;
      anim.fr.groups.forEach(o => o.g.scale.setScalar(Math.max(0.001, ease((t - o.delay) / 0.55))));
    }
    const now = performance.now() / 1000;
    if (focus.fr && focus.fr.groups.length && now >= focus.next && now >= focus.hold){
      setFocus(focus.fr, (focus.i + 1) % focus.fr.groups.length); focus.next = now + 3;
    }
    renderer.render(scene, camera);
  });
}
$("start").addEventListener("click", start);
</script>
</body>
</html>
